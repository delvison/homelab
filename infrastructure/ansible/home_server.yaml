---
- hosts: server
  become: true
  pre_tasks:
    - name: update repository index (ubuntu)
      tags: always
      apt:
        update_cache: yes
      changed_when: false
      when: ansible_facts["distribution"] == "Ubuntu"

- hosts: server
  vars_files:
    - "./vars/vault.yml"
  become: true
  roles:
    - base

- hosts: server
  vars_files:
    - "./vars/vault.yml"
  become: true
  roles:
    - docker_hosts
  tags:
    - docker

- hosts: server
  vars_files:
    - "./vars/vault.yml"
  become: true
  roles:
    - tailscale
  tags:
    - tailscale

- hosts: server
  vars_files:
    - "./vars/vault.yml"
  become: true
  roles:
    - node_exporter
