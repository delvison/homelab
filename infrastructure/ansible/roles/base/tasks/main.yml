---
- name: install sudo
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  with_items:
    - sudo
  when: ansible_facts["distribution"] == "Debian"

- name: add group
  ansible.builtin.group:
    name: "{{ admin_group }}"
    state: present

- name: Add user {{ admin_user }}
  user:
    name: "{{ admin_user }}"
    group: "{{ admin_group }}"
    password: "{{ admin_password_hashed }}"
    shell: /bin/bash
    home: "/home/{{ admin_user }}"
    create_home: yes
    state: present

- name: sudo without password for admin group
  copy:
    content: "%{{ admin_group }} ALL=(ALL:ALL) NOPASSWD:ALL"
    dest: /etc/sudoers.d/admin_nopasswd
    mode: 0440

- name: Add SSH public key for user
  authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_public_key }}"
    state: present

- name: create prompt.sh
  template:
    src: prompt.sh.j2
    dest: /etc/profile.d/prompt.sh
    owner: root
    group: root
    mode: '0644'

- name: Append umask to /etc/profile
  ansible.builtin.lineinfile:
    path: /etc/profile
    state: present
    regexp: '^umask.*'
    line: |
      umask 077

- name: Append prompt settings to /etc/profile
  ansible.builtin.lineinfile:
    path: /etc/profile
    state: present
    regexp: '^source \/etc\/profile.d\/prompt\.sh$'
    line: |
      source /etc/profile.d/prompt.sh

- name: install "rsyslog" package
  become: true
  ansible.builtin.apt:
    name: rsyslog
  when: ansible_facts["distribution"] == "Debian"

- name: install "ufw" package
  become: true
  ansible.builtin.apt:
    name: ufw
  when: ansible_facts["distribution"] == "Ubuntu" or ansible_facts["distribution"] == "Debian"

- ufw:
    rule: allow
    name: OpenSSH

# ufw supports connection rate limiting, which is useful for protecting
# against brute-force login attacks. ufw will deny connections if an IP
# address has attempted to initiate 6 or more connections in the last
# 30 seconds. See  http://www.debian-administration.org/articles/187
# for details. Typical usage is:
- ufw:
    rule: limit
    port: ssh
    proto: tcp

- name: Enable ufw
  ufw:
    state: enabled

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present
  when: ansible_facts["os_family"] == "Debian"

- name: Install fail2ban
  yum:
    name: fail2ban
    state: present
  when: ansible_facts["os_family"] == "RedHat"

- name: Configure SSH jail
  blockinfile:
    path: /etc/fail2ban/jail.d/ansible-sshd.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      [sshd]
      port = ssh
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      bantime = 600
    create: true
  notify: restart fail2ban
  when: ansible_facts["os_family"] == "Debian"

- name: Configure SSH jail
  lineinfile:
    path: /etc/fail2ban/jail.d/sshd.conf
    regexp: "^# "
    line: "port = ssh
           filter = sshd
           logpath = /var/log/secure
           maxretry = 3
           bantime = 600"
    state: present
  notify: restart fail2ban
  when: ansible_facts["os_family"] == "RedHat"

- name: Configure fail2ban tailnet jail
  blockinfile:
    path: /etc/fail2ban/jail.d/ansible-tailnet.conf
    marker: "# {mark} ANSIBLE TAILNET BLOCK"
    block: |
      [sshd-tailnet]
      enabled = true
      port = 22
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      bantime = 3600
      banaction = iptables-allports
      backend = auto
    create: true
  notify: restart fail2ban
  when: ansible_facts["os_family"] == "Debian"

- name: Install qemu-guest-agent on VM hosts
  package:
    name: qemu-guest-agent
    state: present
  when: "'vm' in group_names"

- name: Install unattended-upgrades
  apt:
    name: unattended-upgrades
    state: present
  when: ansible_facts["os_family"] == "Debian"

- name: Configure auto-updates
  template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
  when: ansible_facts["os_family"] == "Debian"

- name: Install logwatch
  apt:
    name: logwatch
    state: present
  when: ansible_facts["os_family"] == "Debian"

- name: Configure logwatch
  template:
    src: logwatch.conf.j2
    dest: /etc/logwatch/conf/logwatch.conf
    mode: '0644'
  when: ansible_facts["os_family"] == "Debian"
