---
- name: Install rclone and fuse3
  ansible.builtin.apt:
    name:
      - rclone
      - fuse3
    state: present

- name: Create rclone system group
  ansible.builtin.group:
    name: "{{ rclone_group }}"
    system: true

- name: Create rclone system user
  ansible.builtin.user:
    name: "{{ rclone_user }}"
    group: "{{ rclone_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ rclone_home }}"
    create_home: true
    state: present

- name: Allow other users to access fuse mounts
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: '^#?\s*user_allow_other'
    line: "user_allow_other"
    state: present
  when: rclone_allow_other

- name: Create rclone config directory
  ansible.builtin.file:
    path: "{{ rclone_config_dir }}"
    state: directory
    owner: "{{ rclone_user }}"
    group: "{{ rclone_group }}"
    mode: '0700'

- name: Configure rclone for rustfs
  ansible.builtin.copy:
    dest: "{{ rclone_config_dir }}/rclone.conf"
    content: |
      [{{ rclone_remote }}]
      type = s3
      provider = Minio
      endpoint = {{ rustfs_endpoint }}
      access_key_id = {{ rustfs_access_key_id }}
      secret_access_key = {{ rustfs_secret_access_key }}
      force_path_style = true
    owner: "{{ rclone_user }}"
    group: "{{ rclone_group }}"
    mode: '0600'
  notify: restart rclone mount

- name: Create rclone cache directory
  ansible.builtin.file:
    path: "{{ rclone_cache_dir }}"
    state: directory
    owner: "{{ rclone_user }}"
    group: "{{ rclone_group }}"
    mode: '0700'

- name: Check if mount point is currently mounted
  ansible.builtin.command: "mountpoint -q {{ rclone_mount_point }}"
  register: rclone_mountpoint
  changed_when: false
  failed_when: false

- name: Unmount existing mount
  ansible.builtin.command: "fusermount3 -uz {{ rclone_mount_point }}"
  when: rclone_mountpoint.rc == 0
  changed_when: true

- name: Create mount point
  ansible.builtin.file:
    path: "{{ rclone_mount_point }}"
    state: directory
    owner: "{{ rclone_user }}"
    group: "{{ rclone_group }}"
    mode: '0755'

- name: Look up mount owner account
  ansible.builtin.getent:
    database: passwd
    key: "{{ rclone_mount_owner }}"

- name: Look up mount owner group
  ansible.builtin.getent:
    database: group
    key: "{{ rclone_mount_group }}"

- name: Resolve mount owner uid/gid
  ansible.builtin.set_fact:
    rclone_mount_uid: "{{ getent_passwd[rclone_mount_owner][1] }}"
    rclone_mount_gid: "{{ getent_group[rclone_mount_group][1] }}"

- name: Deploy rclone mount systemd service
  ansible.builtin.template:
    src: rclone.service.j2
    dest: "/etc/systemd/system/rclone-mount-{{ rclone_remote }}.service"
    mode: '0644'
  notify: restart rclone mount

- name: Reset failed state of rclone mount service
  ansible.builtin.command: "systemctl reset-failed rclone-mount-{{ rclone_remote }}.service"
  changed_when: false
  failed_when: false

- name: Enable and start rclone mount service
  ansible.builtin.systemd:
    name: "rclone-mount-{{ rclone_remote }}.service"
    daemon_reload: true
    enabled: true
    state: restarted