---
node_exporter_version: "1.8.2"
node_exporter_package: "node_exporter-{{ node_exporter_version }}.linux-amd64"
node_exporter_tarball: "{{ node_exporter_package }}.tar.gz"
node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_tarball }}"
node_exporter_install_dir: "/usr/local/bin"
node_exporter_user: "node-exporter"
node_exporter_port: 9100
node_exporter_textfile_dir: "/var/lib/node_exporter/textfile_collector"
