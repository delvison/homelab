- name: Install required packages
  apt:
    name:
      - curl
      - unzip
    state: present
  when: ansible_facts["distribution"] == "Ubuntu" or ansible_facts["distribution"] == "Debian"

- name: Create Caddy log directory
  file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'

- name: Ensure Caddy logs are readable by fail2ban
  file:
    path: /var/log/caddy
    mode: '0755'
    recurse: yes

- name: Create web root for public site
  file:
    path: /var/www/html
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'

- name: Download Caddy deb file
  get_url:
    url: "https://github.com/caddyserver/caddy/releases/download/v{{ caddy_version }}/caddy_{{ caddy_version }}_linux_amd64.deb"
    dest: /tmp/caddy_{{ caddy_version }}_linux_amd64.deb
  when: ansible_facts["distribution"] == "Ubuntu" or ansible_facts["distribution"] == "Debian"

- name: Install Caddy deb file
  apt:
    deb: /tmp/caddy_{{ caddy_version }}_linux_amd64.deb
    state: present
  when:
    - ansible_facts["distribution"] == "Ubuntu" or ansible_facts["distribution"] == "Debian"
    - not ansible_check_mode

- name: Change ownership of /etc/caddy to caddy:caddy
  file:
    path: /etc/caddy
    owner: caddy
    group: caddy
    mode: 0755

- name: Download Caddy server binary with cloudflare and ratelimit modules
  get_url:
    url: "https://caddyserver.com/api/download?os=linux&arch=amd64&p=github.com%2Fcaddy-dns%2Fcloudflare&p=github.com%2Fmholt%2Fcaddy-ratelimit&version={{ caddy_version }}"
    dest: "/tmp/caddy_{{ caddy_version }}_cloudflare"
    # The plugin set is encoded in the URL, not the file name. A cached copy
    # from before a plugin was added would install a binary that lacks it.
    force: yes
    mode: '0755'
  become: yes

- name: Install Caddy binary with cloudflare and ratelimit modules
  copy:
    src: "/tmp/caddy_{{ caddy_version }}_cloudflare"
    dest: /usr/bin/caddy
    remote_src: yes
    mode: '0755'
  become: yes
  when: not ansible_check_mode
  notify:
    - Restart caddy

- name: Verify Caddy binary version
  command: caddy version
  register: caddy_version_check
  changed_when: false
  when: not ansible_check_mode

- name: Assert Caddy binary matches caddy_version
  assert:
    that: caddy_version_check.stdout is search('v' ~ caddy_version ~ ' ')
    fail_msg: "Caddy binary is not v{{ caddy_version }}: {{ caddy_version_check.stdout }}"
  when: not ansible_check_mode

- name: Check if Caddyfile exists
  stat:
    path: /etc/caddy/Caddyfile
  register: ansible_stat

- name: Copy Caddyfile to backup if exists
  copy:
    src: /etc/caddy/Caddyfile
    dest: /etc/caddy/Caddyfile.bk
    remote_src: yes
  when: ansible_stat.stat.exists

- name: Create Caddyfile
  template:
    src: templates/Caddyfile.j2
    dest: /etc/caddy/Caddyfile
  become: yes
  become_user: caddy
  notify:
    - Restart caddy

# Fail2ban configuration for Caddy protection
- name: Ensure fail2ban is installed
  apt:
    name: fail2ban
    state: present
  when: ansible_facts["distribution"] == "Ubuntu" or ansible_facts["distribution"] == "Debian"

- name: Deploy Caddy fail2ban filter
  template:
    src: templates/caddy-filter.conf.j2
    dest: /etc/fail2ban/filter.d/caddy.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload fail2ban

- name: Deploy Caddy .env scan fail2ban filter
  template:
    src: templates/caddy-envscan-filter.conf.j2
    dest: /etc/fail2ban/filter.d/caddy-envscan.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload fail2ban

- name: Deploy Caddy fail2ban jail
  template:
    src: templates/caddy-jail.conf.j2
    dest: /etc/fail2ban/jail.d/caddy.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart fail2ban

# ignoreip and ban escalation for every jail on the host, not just Caddy's.
- name: Deploy shared fail2ban defaults
  template:
    src: templates/fail2ban-defaults.conf.j2
    dest: /etc/fail2ban/jail.d/00-ansible-defaults.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart fail2ban

# Only present once a token exists; the jail file references `ntfy` under the
# same condition, so a host without a token keeps the stock ban action alone.
- name: Deploy the ntfy ban notification action
  template:
    src: templates/fail2ban-ntfy.conf.j2
    dest: /etc/fail2ban/action.d/ntfy.conf
    owner: root
    group: root
    mode: '0640'
  notify: Restart fail2ban
  when: ntfy_security_token is defined and ntfy_security_token | length > 0

# fail2ban silently skips any filter it cannot compile. That is how every Caddy
# jail on this host ended up disabled: a bad datepattern made the filter
# unparseable, the daemon kept running, and nothing reported a problem. Fail the
# play instead of shipping a filter that does nothing.
- name: Write a synthetic line for the filter compile check
  copy:
    dest: /tmp/fail2ban-caddy-check.log
    mode: '0644'
    content: |
      {"level":"info","ts":"2026-01-01T00:00:00Z","logger":"http.log.access.log0","msg":"handled request","request":{"remote_ip":"203.0.113.7","client_ip":"203.0.113.7","method":"GET","host":"probe.invalid","uri":"/"},"status":404}

- name: Verify the Caddy fail2ban filters compile
  command: >-
    fail2ban-regex --print-no-missed --print-no-ignored
    /tmp/fail2ban-caddy-check.log {{ item }}
  loop:
    - /etc/fail2ban/filter.d/caddy.conf
    - /etc/fail2ban/filter.d/caddy-envscan.conf
  changed_when: false

- name: Remove the filter compile check log
  file:
    path: /tmp/fail2ban-caddy-check.log
    state: absent

- name: Ensure fail2ban is enabled and running
  systemd:
    name: fail2ban
    state: started
    enabled: yes

# --- Edge firewall -------------------------------------------------------
# Only this role runs on the public host, so the default-deny policy lives
# here rather than in roles/base: applying it to the LAN hosts would cut
# Grafana, Prometheus and the node exporters.
- name: Install ufw
  apt:
    name: ufw
    state: present
  when: ansible_facts["os_family"] == "Debian"

# The SSH port must be allowed before the default-deny policy lands; reading
# it from sshd beats trusting a hand-kept variable, and the variable covers a
# socket-activated listener that sshd -T would report as the default 22.
- name: Read the SSH ports sshd will listen on
  command: sshd -T
  register: sshd_effective_config
  changed_when: false

- name: Allow SSH on every configured port
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: >-
    {{ (sshd_effective_config.stdout_lines
        | select('match', '^port ')
        | map('regex_replace', '^port\s+', '')
        | list + [caddy_ssh_port | string])
       | unique }}

- name: Allow HTTP and HTTPS
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    # HTTP/3 is QUIC over UDP; without this browsers fall back to TCP.
    - { port: "443", proto: udp }

- name: Default deny incoming, allow outgoing
  ufw:
    policy: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { policy: deny, direction: incoming }
    - { policy: allow, direction: outgoing }

- name: Enable ufw
  ufw:
    state: enabled

# --- SSH hardening -------------------------------------------------------
- name: Create the sshd drop-in directory
  file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Harden sshd
  template:
    src: templates/sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: '0644'

# A drop-in that sshd never reads looks identical to one that works. Read the
# effective config back and fail the play if it did not take.
- name: Read the effective sshd settings
  shell: sshd -T | grep -E '^(passwordauthentication|permitrootlogin|kbdinteractiveauthentication|maxauthtries|x11forwarding) '
  register: sshd_effective
  changed_when: false
  when: not ansible_check_mode

- name: Fail when the sshd drop-in is not in effect
  assert:
    that:
      - "'passwordauthentication no' in sshd_effective.stdout"
      - "'permitrootlogin no' in sshd_effective.stdout"
      - "'kbdinteractiveauthentication no' in sshd_effective.stdout"
      - "'maxauthtries 3' in sshd_effective.stdout"
      - "'x11forwarding no' in sshd_effective.stdout"
    fail_msg: "sshd_config.d is not included; the hardening drop-in has no effect"
  when: not ansible_check_mode

# Always run: a rerun after fixing a missing Include changes no template, so a
# notify would never fire and the live daemon would stay unhardened.
- name: Validate and apply the sshd config
  shell: |
    set -e
    sshd -t
    systemctl reload ssh
  changed_when: false
  when: not ansible_check_mode
