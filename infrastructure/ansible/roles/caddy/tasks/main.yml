- name: Install required packages
  apt:
    name:
      - curl
      - unzip
    state: present
  when: ansible_distribution == "Ubuntu" or ansible_distribution == "Debian"

- name: Create Caddy log directory
  file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'

- name: Ensure Caddy logs are readable by fail2ban
  file:
    path: /var/log/caddy
    mode: '0755'
    recurse: yes

- name: Download Caddy deb file
  get_url:
    url: "https://github.com/caddyserver/caddy/releases/download/v{{ caddy_version }}/caddy_{{ caddy_version }}_linux_amd64.deb"
    dest: /tmp/caddy_{{ caddy_version }}_linux_amd64.deb
  when: ansible_distribution == "Ubuntu" or ansible_distribution == "Debian"

- name: Install Caddy deb file
  apt:
    deb: /tmp/caddy_{{ caddy_version }}_linux_amd64.deb
    state: present
  when: ansible_distribution == "Ubuntu" or ansible_distribution == "Debian"

- name: Change ownership of /etc/caddy to caddy:caddy
  file:
    path: /etc/caddy
    owner: caddy
    group: caddy
    mode: 0755

- name: Download Caddy server binary with cloudflare module
  get_url:
    url: "https://caddyserver.com/api/download?os=linux&arch=amd64&p=github.com%2Fcaddy-dns%2Fcloudflare"
    dest: /usr/bin/caddy
    mode: '0755'
  become: yes

- name: Check if Caddyfile exists
  stat:
    path: /etc/caddy/Caddyfile
  register: ansible_stat

- name: Copy Caddyfile to backup if exists
  copy:
    src: /etc/caddy/Caddyfile
    dest: /etc/caddy/Caddyfile.bk
    remote_src: yes
  when: ansible_stat.stat.exists

- name: Create Caddyfile
  template:
    src: templates/Caddyfile.j2
    dest: /etc/caddy/Caddyfile
  become: yes
  become_user: caddy
  notify:
    - Restart caddy
    - Validate caddy

# Fail2ban configuration for Caddy protection
- name: Ensure fail2ban is installed
  apt:
    name: fail2ban
    state: present
  when: ansible_distribution == "Ubuntu" or ansible_distribution == "Debian"

- name: Deploy Caddy fail2ban filter
  template:
    src: templates/caddy-filter.conf.j2
    dest: /etc/fail2ban/filter.d/caddy.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload fail2ban

- name: Deploy Caddy fail2ban jail
  template:
    src: templates/caddy-jail.conf.j2
    dest: /etc/fail2ban/jail.d/caddy.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  systemd:
    name: fail2ban
    state: started
    enabled: yes
