# Validate and restart in one handler. A separate validate handler with
# `changed_when: false` would not fire its notify, leaving Caddy down after
# the deb postinst has already stopped it.
- name: Restart caddy
  become: yes
  shell: |
    set -e
    caddy validate --config /etc/caddy/Caddyfile
    systemctl restart caddy

# Validate first: a drop-in with a typo would otherwise leave sshd unable to
# reload, and the next reboot would lock the host out.
- name: Reload sshd
  become: yes
  shell: |
    set -e
    sshd -t
    systemctl reload ssh

- name: Restart fail2ban
  become: yes
  systemd:
    name: fail2ban
    state: restarted

- name: Reload fail2ban
  become: yes
  systemd:
    name: fail2ban
    state: reloaded
