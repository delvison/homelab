# Description: Install Caddy and ship its access logs to the monitoring collector
# ref: https://caddyserver.com/
---
- name: Install Caddy and log shipping
  become: true
  hosts: caddy
  vars_files:
    - "./vars/vault.yml"
  roles:
    - role: caddy
      tags: [caddy]
    - role: otelcol
      tags: [otelcol]
