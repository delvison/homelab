---
networks:
  internal-monitoring:
services:
  tor:
    image: btcpayserver/tor:0.4.8.10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.02'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal-monitoring

  ntfy-server:
    image: binwiederhier/ntfy
    container_name: ntfy-server
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "128k"
        max-file: "1"
    command: serve
    environment:
      TZ: America/New_York
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ATTACHMENT_CACHE_DIR: /tmp/ntfy-attachments
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_CACHE_FILE: /tmp/ntfy-cache.db
    user: ${UID}:${GID}
    volumes:
      - ${BASE_DIR:-.}/ntfy/ntfy:/var/lib/ntfy
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 50M
      - type: tmpfs
        target: /var/cache/ntfy
        tmpfs:
          size: 20M
    ports:
      - 12500:80
    deploy:
      resources:
        limits:
          cpus: '0.01'
          memory: 64M
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - internal-monitoring

  gatus-postgres-internal:
    image: postgres:15-alpine
    restart: always
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 100M
    environment:
      - POSTGRES_DB=gatus
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Performance optimizations for ephemeral data
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - PGDATA=/var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/lib/postgresql/data:size=100M,noexec,nosuid,nodev
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c bgwriter_lru_maxpages=0
      -c wal_level=minimal
      -c max_wal_senders=0
      -c shared_buffers=32MB
      -c effective_cache_size=64MB
      -c work_mem=8MB
      -c maintenance_work_mem=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "gatus"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.01'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 32m
        max-file: "1"
    networks:
      - internal-monitoring

  gatus-internal:
    image: twinproduction/gatus:stable
    container_name: gatus-internal
    user: ${UID}:${GID}
    ports:
      - 8076:8080
    cap_add:
      - NET_ADMIN
    volumes:
      - "${BASE_DIR:-.}/gatus/config/:/config:ro"
      - type: tmpfs
        target: /data
        tmpfs:
          size: 50M
    environment:
      GATUS_CONFIG_PATH: "/config"
      NTFY_URL: "${NTFY_URL}"
      NTFY_TOKEN: "${NTFY_TOKEN}"
      NTFY_TOPIC: "${NTFY_TOPIC}"
      GATUS_DB_USER: "${GATUS_DB_USER}"
      GATUS_DB_PASSWORD: "${GATUS_DB_PASSWORD}"
      GATUS_STORAGE_PATH: "/data/gatus.db"
    deploy:
      resources:
        limits:
          cpus: '0.02'
          memory: 128M
    restart: always
    depends_on:
      tor:
        condition: service_started
      ntfy-server:
        condition: service_started
      gatus-postgres-internal:
        condition: service_healthy
    networks:
      - internal-monitoring
    dns:
      - ${DNS_SERVER}


