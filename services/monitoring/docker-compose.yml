networks:
  monitoring:
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib
    container_name: otel-collector
    restart: always
    volumes:
      - ${BASE_DIR:-.}/otelcol/config.yaml:/etc/otelcol-contrib/config.yaml
      - /proc:/hostfs/proc
    logging:
      driver: json-file
      options:
        max-size: 512m
    ports:
      # - 1888:1888 # pprof extension
      # - 8888:8888 # Prometheus metrics exposed by the Collector
      # - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      # - 55679:55679 # zpages extension
    environment:
      HOST: ${HOST}
      OTEL_AUTH_TOKEN: ${OTEL_AUTH_TOKEN}
    networks:
      - monitoring
    depends_on:
      - telegraf
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  influxdb:
    image: influxdb:2.0
    container_name: influxdb
    restart: unless-stopped
    volumes:
      - ${BASE_DIR:-.}/influxdb/data:/var/lib/influxdb2
      - ${BASE_DIR:-.}/influxdb/config:/etc/influxdb2
    logging:
      driver: json-file
      options:
        max-size: 512m
    ports:
      - '8086:8086'
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: "${DOCKER_INFLUXDB_INIT_USERNAME}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${DOCKER_INFLUXDB_INIT_PASSWORD}"
      DOCKER_INFLUXDB_INIT_ORG: "${DOCKER_INFLUXDB_INIT_ORG}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${DOCKER_INFLUXDB_INIT_BUCKET}"
    networks:
      - monitoring
    healthcheck:
        test: "curl -f http://localhost:8086/ping"
        interval: 5s
        timeout: 10s
        start_period: 30s
        retries: 5

  # default creds: admin:admin
  # Ref: https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
  grafana:
    image: grafana/grafana-enterprise
    user: ${UID}:${GID}
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ${BASE_DIR:-.}/grafana/data:/var/lib/grafana
      - ${BASE_DIR:-.}/grafana/grafana.ini:/etc/grafana/grafana.ini
    logging:
      driver: json-file
      options:
        max-size: 512m
    ports:
      - '3000:3000'
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_DOMAIN="grafana.local.${DOMAIN}"
      # - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      # - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
    networks:
      - monitoring
    healthcheck:
      test: curl --fail http://localhost:3000/healthz || exit 1
      interval: 60s
      retries: 5
      start_period: 30s
      timeout: 10s
    secrets:
      - admin_password
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  telegraf:
    image: docker.io/telegraf:latest
    restart: always
    container_name: telegraf
    environment:
      HOST_PROC: /rootfs/proc
      HOST_SYS: /rootfs/sys
      HOST_ETC: /rootfs/etc
      EUID: 1000
    hostname: ${HOST}
    volumes:
     - /var/run/docker.sock:/var/run/docker.sock:ro
     - /sys:/rootfs/sys:ro
     - /proc:/rootfs/proc:ro
     - /etc:/rootfs/etc:ro
    logging:
      driver: json-file
      options:
        max-size: 512m
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > ./etc/telegraf/telegraf.conf
        [global_tags]
        [agent]
          interval = "60s"
          round_interval = true
          metric_batch_size = 1000
          metric_buffer_limit = 10000
          collection_jitter = "0s"
          flush_interval = "10s"
          flush_jitter = "0s"
          precision = "0s"
          hostname = "${HOST}"
          omit_hostname = false

        [[inputs.kernel]]
        [[inputs.system]]
        [[inputs.processes]]
        [[inputs.diskio]]
        [[inputs.cpu]]
        [[inputs.mem]]
        [[inputs.disk]]
          ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
        [[inputs.nstat]]
        [[inputs.temp]]
        [[inputs.net]]
        [[inputs.opentelemetry]]
          service_address = "0.0.0.0:4317"
        #[[outputs.file]]
          #files = ["stdout"]
        [[outputs.influxdb_v2]]
          urls = ["http://influxdb:8086"]
          token = "${INFLUXDB_TOKEN}"
          organization = "self-hosted"
          bucket = "homelab"
        EOF
        /entrypoint.sh telegraf
    networks:
      - monitoring
    depends_on:
      - influxdb
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  prometheus-init:
    image: alpine:3.19
    container_name: prometheus-init
    volumes:
      - ${BASE_DIR:-.}/prometheus:/etc/prometheus:rw
      - prometheus-tmp:/tmp
    environment:
      - PROMETHEUS_ADMIN_PASSWORD=${PROMETHEUS_ADMIN_PASSWORD:-changeme}
      - PROMETHEUS_BOT_PASSWORD=${PROMETHEUS_BOT_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        apk add --no-cache apache2-utils > /dev/null 2>&1
        HASH=$$(echo "$$PROMETHEUS_ADMIN_PASSWORD" | htpasswd -niBC 10 admin | cut -d: -f2 | tr -d '\n' | sed 's/\$$2y/\$$2a/')
        cat > /etc/prometheus/web.yml << EOF
        basic_auth_users:
          admin: $$HASH
        EOF
        if [ -n "$$PROMETHEUS_BOT_PASSWORD" ]; then
          BHASH=$$(echo "$$PROMETHEUS_BOT_PASSWORD" | htpasswd -niBC 10 bot | cut -d: -f2 | tr -d '\n' | sed 's/\$$2y/\$$2a/')
          echo "  bot: $$BHASH" >> /etc/prometheus/web.yml
        fi
        cat >> /etc/prometheus/web.yml << EOF
        http_server_config:
          http2: true
        EOF
        echo "Generated web.yml successfully"
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ${BASE_DIR:-.}/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
      - prometheus-tmp:/tmp
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.config.file=/etc/prometheus/web.yml'
    depends_on:
      otel-collector:
        condition: service_started
      prometheus-init:
        condition: service_completed_successfully
    healthcheck:
      test: "wget --no-check-certificate -qO- http://localhost:9090/-/healthy || exit 1"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 512m
        max-file: "5"
    networks:
      - monitoring
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    security_opt:
      - no-new-privileges:true
    read_only: true

  # For Grafana to send emails
  postfix:
    image: boky/postfix@sha256:4b7e77349a09779b7fea281db2f113e66da69cdc362fbfb55fbc8c5716952d16
    container_name: postfix
    restart: unless-stopped
    environment:
      - "ALLOWED_SENDER_DOMAINS=grafana.localhost"
    # ports:
    #   - 1587:587
    networks:
      - monitoring
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

secrets:
  admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

volumes:
  prometheus-data:
  prometheus-tmp:
