networks:
  monitoring:
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib
    container_name: otel-collector
    restart: always
    volumes:
      - ${BASE_DIR:-.}/otelcol/config.yaml:/etc/otelcol-contrib/config.yaml
      - /proc:/hostfs/proc
    logging:
      driver: json-file
      options:
        max-size: 64m
        max-file: "2"
    ports:
      # - 1888:1888 # pprof extension
      # - 8888:8888 # Prometheus metrics exposed by the Collector
      # - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      # - 55679:55679 # zpages extension
    environment:
      HOST: ${HOST}
      OTEL_AUTH_TOKEN: ${OTEL_AUTH_TOKEN}
    networks:
      - monitoring
    depends_on:
      - telegraf
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  influxdb:
    image: influxdb:2.0
    container_name: influxdb
    restart: unless-stopped
    volumes:
      - ${BASE_DIR:-.}/influxdb/data:/var/lib/influxdb2
      - ${BASE_DIR:-.}/influxdb/config:/etc/influxdb2:ro
    logging:
      driver: json-file
      options:
        max-size: 128m
        max-file: "3"
    ports:
      - '8086:8086'
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: "${DOCKER_INFLUXDB_INIT_USERNAME}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${DOCKER_INFLUXDB_INIT_PASSWORD}"
      DOCKER_INFLUXDB_INIT_ORG: "${DOCKER_INFLUXDB_INIT_ORG}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${DOCKER_INFLUXDB_INIT_BUCKET}"
      # Performance optimizations for NVMe temp reduction
      INFLUXDB_STORAGE_CACHE_MAX_MEMORY_SIZE: "268435456"
      INFLUXDB_STORAGE_CACHE_SNAPSHOT_MEMORY_SIZE: "134217728"
      INFLUXDB_STORAGE_WAL_FSYNC_DELAY: "10s"
      INFLUXDB_STORAGE_SERIES_ID_SET_CACHE_SIZE: "100"
      INFLUXDB_HTTP_MAX_ROW_LIMIT: "10000"
    networks:
      - monitoring
    healthcheck:
        test: "curl -f http://localhost:8086/ping"
        interval: 5s
        timeout: 10s
        start_period: 30s
        retries: 5

  # default creds: admin:admin
  # Ref: https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
  grafana:
    image: grafana/grafana-enterprise
    user: ${UID}:${GID}
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ${BASE_DIR:-.}/grafana/data:/var/lib/grafana
      - ${BASE_DIR:-.}/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ${BASE_DIR:-.}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${BASE_DIR:-.}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - type: tmpfs
        target: /var/lib/grafana/sessions
        tmpfs:
          size: 32M
      - type: tmpfs
        target: /var/lib/grafana/tmp
        tmpfs:
          size: 64M
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 32M
    logging:
      driver: json-file
      options:
        max-size: 64m
        max-file: "2"
    ports:
      - '3000:3000'
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_DOMAIN="grafana.local.${DOMAIN}"
      # - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      # - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
    networks:
      - monitoring
    healthcheck:
      test: curl --fail http://localhost:3000/healthz || exit 1
      interval: 60s
      retries: 5
      start_period: 30s
      timeout: 10s
    secrets:
      - admin_password
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  telegraf:
    image: docker.io/telegraf:latest
    restart: always
    container_name: telegraf
    environment:
      HOST_PROC: /rootfs/proc
      HOST_SYS: /rootfs/sys
      HOST_ETC: /rootfs/etc
      EUID: 1000
    hostname: ${HOST}
    volumes:
     - /var/run/docker.sock:/var/run/docker.sock:ro
     - /sys:/rootfs/sys:ro
     - /proc:/rootfs/proc:ro
     - /etc:/rootfs/etc:ro
    logging:
      driver: json-file
      options:
        max-size: 64m
        max-file: "2"
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > ./etc/telegraf/telegraf.conf
        [global_tags]
        [agent]
          interval = "120s"
          round_interval = true
          metric_batch_size = 5000
          metric_buffer_limit = 20000
          collection_jitter = "5s"
          flush_interval = "60s"
          flush_jitter = "10s"
          precision = "0s"
          hostname = "${HOST}"
          omit_hostname = false

        [[inputs.kernel]]
        [[inputs.system]]
        [[inputs.processes]]
        [[inputs.diskio]]
        [[inputs.cpu]]
        [[inputs.mem]]
        [[inputs.disk]]
          ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
        [[inputs.nstat]]
        [[inputs.temp]]
        [[inputs.net]]
        [[inputs.opentelemetry]]
          service_address = "0.0.0.0:4317"
        #[[outputs.file]]
          #files = ["stdout"]
        [[outputs.influxdb_v2]]
          urls = ["http://influxdb:8086"]
          token = "${INFLUXDB_TOKEN}"
          organization = "self-hosted"
          bucket = "homelab"
        EOF
        /entrypoint.sh telegraf
    networks:
      - monitoring
    depends_on:
      - influxdb
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  prometheus-init:
    # httpd ships `htpasswd`, and this image is already on the monitoring host.
    # It has no egress, so `alpine` + `apk add apache2-utils` can never work
    # there. Pinned by digest upstream would be better; kept as-is to match the
    # image the host already holds.
    image: httpd:2-alpine
    container_name: prometheus-init
    volumes:
      - ${BASE_DIR:-.}/prometheus:/etc/prometheus:rw
      - prometheus-tmp:/tmp
    environment:
      - PROMETHEUS_ADMIN_PASSWORD=${PROMETHEUS_ADMIN_PASSWORD:-changeme}
      - PROMETHEUS_BOT_PASSWORD=${PROMETHEUS_BOT_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        # This host has no egress, so `apk add` can fail. Writing a web.yml with
        # an empty hash makes Prometheus crash-loop with
        # "hashedSecret too short to be a bcrypted password", so every failure
        # path below is explicit: keep a good file, or stop loudly.
        set -eu
        WEB=/etc/prometheus/web.yml

        if [ -z "$${PROMETHEUS_ADMIN_PASSWORD:-}" ]; then
          echo "ERROR: PROMETHEUS_ADMIN_PASSWORD is empty; refusing to generate web.yml" >&2
          exit 1
        fi

        if ! command -v htpasswd >/dev/null 2>&1; then
          apk add --no-cache apache2-utils >/dev/null 2>&1 || true
        fi

        if ! command -v htpasswd >/dev/null 2>&1; then
          if [ -s "$$WEB" ] && grep -qE '^[[:space:]]+admin:[[:space:]]+\$$2[aby]\$$' "$$WEB"; then
            echo "htpasswd unavailable; keeping existing $$WEB unchanged" >&2
            exit 0
          fi
          echo "ERROR: htpasswd unavailable and $$WEB has no usable admin hash." >&2
          echo "       Run 'just sync-web-config' in services/monitoring first." >&2
          exit 1
        fi

        HASH=$$(printf '%s' "$$PROMETHEUS_ADMIN_PASSWORD" | htpasswd -niBC 10 admin | cut -d: -f2 | tr -d '\n' | sed 's/^\$$2y/\$$2a/')
        if ! printf '%s' "$$HASH" | grep -qE '^\$$2[aby]\$$'; then
          echo "ERROR: refusing to write an invalid bcrypt hash (is PROMETHEUS_ADMIN_PASSWORD empty?)" >&2
          exit 1
        fi

        # Render next to the real file and move into place, so a failure can
        # never leave a truncated web.yml behind.
        TMP="$$WEB.tmp"
        {
          echo 'basic_auth_users:'
          echo "  admin: $$HASH"
        } > "$$TMP"

        if [ -n "$${PROMETHEUS_BOT_PASSWORD:-}" ]; then
          BHASH=$$(printf '%s' "$$PROMETHEUS_BOT_PASSWORD" | htpasswd -niBC 10 bot | cut -d: -f2 | tr -d '\n' | sed 's/^\$$2y/\$$2a/')
          if ! printf '%s' "$$BHASH" | grep -qE '^\$$2[aby]\$$'; then
            echo "ERROR: refusing to write an invalid bcrypt hash for bot" >&2
            rm -f "$$TMP"
            exit 1
          fi
          echo "  bot: $$BHASH" >> "$$TMP"
        fi

        cat >> "$$TMP" << 'EOF'
        http_server_config:
          http2: true
        EOF

        mv "$$TMP" "$$WEB"
        echo "Generated web.yml successfully"
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    ports:
      - "9090:9090"
    environment:
      - PROMETHEUS_ADMIN_PASSWORD=${PROMETHEUS_ADMIN_PASSWORD}
    volumes:
      - ${BASE_DIR:-.}/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 64M
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.min-block-duration=2h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--web.enable-lifecycle'
      - '--web.config.file=/etc/prometheus/web.yml'
    depends_on:
      otel-collector:
        condition: service_started
      prometheus-init:
        condition: service_completed_successfully
    healthcheck:
      test: "wget --no-check-certificate -qO- http://admin:${PROMETHEUS_ADMIN_PASSWORD}@localhost:9090/-/healthy || exit 1"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 512m
        max-file: "5"
    networks:
      - monitoring
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    security_opt:
      - no-new-privileges:true
    read_only: true

  alertmanager:
    build: ./alertmanager
    container_name: alertmanager
    ports:
      # Prometheus and Grafana use this network; nothing needs the LAN port.
      - "127.0.0.1:9093:9093"
    volumes:
      - alertmanager-data:/alertmanager
    environment:
      - NTFY_DOMAIN=${NTFY_DOMAIN}
      - NTFY_TOKEN=${NTFY_TOKEN}
      - NTFY_TOPIC=${NTFY_TOPIC}
    networks:
      - monitoring
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # For Grafana to send emails
  postfix:
    image: boky/postfix@sha256:4b7e77349a09779b7fea281db2f113e66da69cdc362fbfb55fbc8c5716952d16
    container_name: postfix
    restart: unless-stopped
    environment:
      - "ALLOWED_SENDER_DOMAINS=grafana.localhost"
    # ports:
    #   - 1587:587
    networks:
      - monitoring
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Dead-man's switch: pings healthchecks only while the edge answers, so a
  # missing ping means the edge or this host is down. Delivery is the VPS ntfy,
  # so a dead VPS is detected but never announced. HC_PING_URL must be the
  # https://<name> form: healthchecks answers 400 on a bare IP:8095.
  heartbeat:
    image: alpine:3.19
    container_name: heartbeat
    restart: unless-stopped
    # The monitoring host's resolver answers NXDOMAIN for the LAN zone, so pin
    # the name to local-caddy. Revisit if the LAN proxy moves.
    extra_hosts:
      - "healthchecks.local.donttrackme.xyz:192.168.1.178"
    environment:
      - EDGE_URL=${EDGE_URL:?EDGE_URL must be set}
      - HC_PING_URL=${HC_PING_URL:?HC_PING_URL must be set}
    command:
      - sh
      - -c
      - |
        while :; do
          if wget -q -O /dev/null --timeout=10 "$$EDGE_URL"; then
            wget -q -O /dev/null --timeout=10 "$$HC_PING_URL" || echo "healthchecks ping failed"
          else
            echo "edge unreachable; skipping the ping"
          fi
          sleep 600
        done
    deploy:
      resources:
        limits:
          cpus: '0.01'
          memory: 32M
    networks:
      - monitoring

secrets:
  admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

volumes:
  prometheus-data:
  prometheus-tmp:
  alertmanager-data:
