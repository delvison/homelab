---
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    cluster: homelab
    replica: '{{.ExternalURL}}'

#rule_files:
#  - alert.yml

# Alertmanager configuration (uncomment to enable)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

scrape_configs:
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'otel-collector:8889'
