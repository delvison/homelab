groups:
  - name: security
    interval: 30s
    rules:
      # Caddy's block rules (@bad_ua, @attack_paths, @bad_methods and the
      # catch-all `handle { abort }`) close the connection, which Caddy logs as
      # status 0. 403 on this edge means an app denied the request: nearly
      # every 403 in a 3-day sample was ntfy answering a subscriber without
      # read access, so alerting on 403 watches the wrong thing.
      # Observed baseline: ~60 aborted requests per hour, peak 47 per 5 min,
      # so 1/s for 5 min needs a 6x spike. There is no 429 rule because the
      # edge has no rate_limit yet, so nothing can produce a 429.
      - alert: CaddyBlockBurst
        expr: sum(rate(caddy_access_requests_total{status="0"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Caddy is aborting {{ $value | printf \"%.1f\" }} requests/s"
          description: "Sustained aborted requests for 5 minutes: a scanner is tripping the block rules, or a monitor is calling a path the edge does not route."

      - alert: Caddy5xxRate
        expr: sum(rate(caddy_access_requests_total{status=~"5.."}[5m])) > 0.5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Caddy is serving 5xx at {{ $value | printf \"%.2f\" }}/s"
          description: "Sustained server errors for 10 minutes, so an upstream is failing or Caddy itself is unhealthy."

      # No requests at all for 15 minutes. Either the internet is down or the
      # VPS log shipper died; the dead-man's switch (Phase 1.6) is what proves
      # which. Deliberately not a rate() of zero: the receiver's collector keeps
      # a cumulative series flat instead of deleting it, so increase() sees 0.
      - alert: CaddyNoTraffic
        expr: sum(increase(caddy_access_requests_total{host_name="vps"}[15m])) == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "The VPS edge received no HTTPS requests for 15 minutes"
          description: "The public edge is either unreachable or its log shipper stopped exporting."
