---
networks:
  microbin-net:
    # driver: bridge

volumes:
  microbin-data:

services:
  microbin:
    networks:
      - microbin-net
    image: danielszabo99/microbin:latest
    container_name: microbin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      - TZ=${TZ}
      - MICROBIN_PORT=8080
      - MICROBIN_BIND=0.0.0.0
      - MICROBIN_THREADS=1
      - MICROBIN_DATA_DIR=/data
      - MICROBIN_ADMIN_USERNAME=admin
      - MICROBIN_ADMIN_PASSWORD=${MICROBIN_ADMIN_PASSWORD}
      - MICROBIN_PRIVATE=true
      - MICROBIN_HIGHLIGHTSYNTAX=true
      - MICROBIN_SHOW_READ_STATS=false
      - MICROBIN_GC_DAYS=7
      - MICROBIN_ENABLE_BURN_AFTER=true
      - MICROBIN_DEFAULT_BURN_AFTER=0
      - MICROBIN_EDITABLE=false
      - MICROBIN_DEFAULT_EXPIRY=1hour
      - MICROBIN_MAX_EXPIRY=1week
      - MICROBIN_ENCRYPTION_SERVER_SIDE=true
      - MICROBIN_ENCRYPTION_CLIENT_SIDE=true
      - MICROBIN_MAX_FILE_SIZE_UNENCRYPTED_MB=100
      - MICROBIN_MAX_FILE_SIZE_ENCRYPTED_MB=50
      - MICROBIN_DISABLE_TELEMETRY=true
      - MICROBIN_DISABLE_UPDATE_CHECKING=true
      - MICROBIN_HASH_IDS=true
      - MICROBIN_PUBLIC_PATH=${MICROBIN_PUBLIC_URL}
      - MICROBIN_QR=true
      - MICROBIN_NO_LISTING=true
      - MICROBIN_HIDE_LOGO=true
      - MICROBIN_HIDE_FOOTER=true
      - MICROBIN_DEFAULT_PRIVACY=unlisted
    volumes:
      - microbin-data:/data
    ports:
      - "10500:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
