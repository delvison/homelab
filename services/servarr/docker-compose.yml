    container_name: radarr
    image: ghcr.io/hotio/radarr
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=Etc/UTC
    volumes:
      - ${BASE_DIR:-.}/radarr/config:/config
      - movies-vol:/movies
      - downloads-vol:/data
    restart: unless-stopped
    # network_mode: service:protonvpn
    healthcheck:
      test: curl --fail http://localhost:7878 || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    ports:
      - 7878:7878
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  lidarr:
    networks: 
      - proxy
    container_name: lidarr
    image: ghcr.io/hotio/lidarr
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=Etc/UTC
    volumes:
      - ${BASE_DIR:-.}/lidarr/config:/config
      - music-vol:/music
      - downloads-vol:/data
    restart: unless-stopped
    # network_mode: service:protonvpn
    healthcheck:
      test: curl --fail http://localhost:8686 || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    ports:
      - 8686:8686
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # subtitles
  bazarr:
    networks: 
      - proxy
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=Etc/UTC
    volumes:
      - ${BASE_DIR:-.}/bazaar/config:/config
      - tv-vol:/tv
      - movies-vol:/movies
      - downloads-vol:/data
    ports:
      - 6767:6767
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://localhost:6767 || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # IPTV stream management: M3U/EPG proxy, DVR, HDHomeRun emulation for Jellyfin.
  # Docs: https://dispatcharr.github.io/Dispatcharr-Docs/
  # AIO mode bundles postgres + redis inside the container; /data holds the DB,
  # cache, logs and the generated JWT secret, so back it up.
  dispatcharr:
    networks:
      - proxy
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    environment:
      - PUID=${UID}
      - PGID=${GID}
      # DVR schedules and EPG times are rendered in this zone, so it must match
      # the local timezone rather than the Etc/UTC used by the *arr services.
      - TZ=${TZ:-Etc/UTC}
      - DISPATCHARR_ENV=aio
      - DISPATCHARR_LOG_LEVEL=info
      # uWSGI + Celery default to 4 and 6 workers, which alongside the bundled
      # postgres and redis overshoots the 2G limit below. Trim both.
      - UWSGI_WORKERS=2
      - CELERY_MAX_WORKERS=3
      - CELERY_MIN_WORKERS=1
      # Caddy proxies from its own private LAN address, which Dispatcharr's
      # default trusted-proxy set (private/loopback) already covers, so client
      # IPs reach the Network Access rules correctly. Do not set
      # DISPATCHARR_TRUSTED_PROXIES=none: every client would then be logged and
      # rate-limited as the proxy itself.
    volumes:
      - ${BASE_DIR:-.}/dispatcharr/data:/data
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://localhost:9191/ || exit 1
      interval: 60s
      retries: 5
      # first boot runs migrations and initialises postgres
      start_period: 120s
      timeout: 10s
    ports:
      - 9191:9191
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          # bundled postgres + redis + uwsgi (2) + celery (<=3)
          cpus: '2.00'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

