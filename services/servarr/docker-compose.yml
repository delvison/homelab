  sonarr:
    networks: 
      - proxy
    container_name: sonarr
    image: ghcr.io/hotio/sonarr
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=Etc/UTC
    volumes:
      - ${BASE_DIR:-.}/sonarr/config:/config
      - tv-vol:/tv
      - downloads-vol:/data
    restart: unless-stopped
    # network_mode: service:protonvpn
    healthcheck:
      test: curl --fail http://localhost:8989 || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    ports:
      - 8989:8989
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
