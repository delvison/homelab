  prowlarr:
    networks: 
      - proxy
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=Etc/UTC
    volumes:
      - ${BASE_DIR:-.}/prowlarr/config:/config
    restart: unless-stopped
    # network_mode: service:protonvpn
    healthcheck:
      test: curl --fail http://localhost:9696 || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s
    ports:
      - 9696:9696
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # NOTE: readarr retired upstream (2025); ghcr.io/hotio/readarr no longer exists.
