---
networks:
  # NOTE: must run this first: `docker network create proxy`
  proxy:
    external: true
# sudo apt install nfs-common
volumes:
  audiobooks-vol:
    driver_opts:
      type: "nfs"
      o: "addr=${NAS_DOMAIN},nolock,soft,rw"
      device: ":/volume1/shared/30_Media/33_Books/Audiobooks/"
  books-vol:
    driver_opts:
      type: "nfs"
      o: "addr=${NAS_DOMAIN},nolock,soft,rw"
      device: ":/volume1/shared/30_Media/33_Books/Ebooks/"
  downloads-vol:
    driver_opts:
      type: "nfs"
      o: "addr=${NAS_DOMAIN},nolock,soft,rw"
      device: ":/volume1/shared/dl/"
  movies-vol:
    driver_opts:
      type: "nfs"
      o: "addr=${NAS_DOMAIN},nolock,soft,rw"
      device: ":/volume1/shared/30_Media/32_Film/Movies/"
  music-vol:
    driver_opts:
      type: "nfs"
      o: "addr=${NAS_DOMAIN},nolock,soft,rw"
      device: ":/volume1/shared/30_Media/34_Audio/Music/"
  tv-vol:
    driver_opts:
      type: "nfs"
      o: "addr=${NAS_DOMAIN},nolock,soft,rw"
      device: ":/volume1/shared/30_Media/32_Film/TV/"
