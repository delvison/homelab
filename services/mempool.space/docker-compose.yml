---
networks:
  mempool:
    ipam:
      driver: default
      config:
        - subnet: "172.23.0.0/24"
services:
  web:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    environment:
      FRONTEND_HTTP_PORT: "8050"
      BACKEND_MAINNET_HTTP_HOST: "api"
    image: mempool/frontend:${MEMPOOL_FRONTEND_VERSION:-latest}
    user: "1000:1000"
    restart: always
    stop_grace_period: 1m
    command: "./wait-for db:3306 --timeout=720 -- nginx -g 'daemon off;'"
    ports:
      - 8050:8050
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - mempool
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
  api:
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 2048M
    environment:
      MEMPOOL_BACKEND: "electrum"
      ELECTRUM_HOST: "${ELECTRUM_HOST}"
      ELECTRUM_PORT: "50002"
      ELECTRUM_TLS_ENABLED: "true"
      CORE_RPC_HOST: "${CORE_RPC_HOST}"
      CORE_RPC_PORT: "${CORE_RPC_PORT}"
      CORE_RPC_USERNAME: "${CORE_RPC_USERNAME}"
      CORE_RPC_PASSWORD: "${CORE_RPC_PASSWORD}"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: "db"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "${DATABASE_USERNAME}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      STATISTICS_ENABLED: "true"
    depends_on:
      - db
      - tor
      - electrum-tor
      - core-rpc
    image: mempool/backend:${MEMPOOL_BACKEND_VERSION:-latest}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # user: "1002:${GID}"
    restart: always
    stop_grace_period: 1m
    command: "./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh"
    volumes:
      - ${BASE_DIR:-.}/data:/backend/cache
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - mempool
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
  db:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1024M
    environment:
      MYSQL_DATABASE: "mempool"
      MYSQL_USER: "${DATABASE_USERNAME}"
      MYSQL_PASSWORD: "${DATABASE_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    image: mariadb:10.11
    command: --innodb_buffer_pool_size=768M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1002:${GID}"
    restart: always
    stop_grace_period: 1m
    volumes:
      - ${BASE_DIR:-.}/mysql/data:/var/lib/mysql
    networks:
      - mempool
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
  tor:
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 128M
    image: btcpayserver/tor:0.4.8.10
    security_opt:
      - no-new-privileges:true
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - mempool
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
  electrum-tor:
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
    image: alpine/socat:latest
    command: "TCP-LISTEN:50002,fork,reuseaddr SOCKS5-CONNECT:tor:9050:${ELECTRUM_ONION}:50002"
    depends_on:
      - tor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - mempool
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
  core-rpc:
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
    image: alpine/socat:latest
    network_mode: host
    command: "TCP-LISTEN:8332,bind=172.23.0.1,fork,reuseaddr TCP:127.0.0.1:8332"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
